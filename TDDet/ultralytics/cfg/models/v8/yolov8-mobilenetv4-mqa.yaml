# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-MobileNetV4-MQA object detection model with Multi-Query Attention
# Based on: "TDDet: A novel lightweight and efficient tea disease detector"

# Parameters
nc: 6  # number of classes (tea diseases)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024] # Use scale 'l' to keep original channel counts defined in code

# Backbone with Feature Extractors
backbone:
  # [from, repeats, module, args]
  - [-1, 1, MobileNetV4ConvLargeMQA, []]   # 0: Outputs List [None, None, P2, P3, P4, P5]
  
  # Feature Selectors (Adapters to unpack the backbone list)
  # Args: [index_in_list, output_channels]
  # Backbone outputs [P2, P3, P4, P5] -> Indices: 0, 1, 2, 3
  - [-1, 1, FeatureSelector, [1, 256]]     # 1: Select P3 (80x80) - Index 1
  - [-1, 1, FeatureSelector, [2, 512]]     # 2: Select P4 (40x40) - Index 2
  - [-1, 1, FeatureSelector, [3, 512]]     # 3: Select P5 (20x20) - Index 3
  
  - [-1, 1, SPPF, [1024, 5]]               # 4: SPPF (takes from 3 - P5)

# Head: Feature fusion with CFF (Cross-scale Feature Fusion) and DySample upsampling
head:
  # Upsample and fuse P5 -> P4
  - [-1, 1, DySample, [2, 'lp']]          # 5: Upsample P5 (Input: SPPF-4)
  - [[-1, 2], 1, Concat, [1]]             # 6: Concat with P4 (From Layer 2)
  - [-1, 3, CFF, [512]]                   # 7: Cross-scale Feature Fusion

  # Upsample and fuse P4 -> P3
  - [-1, 1, DySample, [2, 'lp']]          # 8: Upsample
  - [[-1, 1], 1, Concat, [1]]             # 9: Concat with P3 (From Layer 1)
  - [-1, 3, CFF, [256]]                   # 10 (P3/8-small): Feature fusion for small objects

  # Downsample and fuse P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]            # 11: Downsample 2x
  - [[-1, 7], 1, Concat, [1]]             # 12: Concat with Head P4 (Layer 7)
  - [-1, 3, CFF, [512]]                   # 13 (P4/16-medium): Feature fusion for medium objects

  # Downsample and fuse P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]            # 14: Downsample 2x
  - [[-1, 4], 1, Concat, [1]]             # 15: Concat with SPPF (Layer 4)
  - [-1, 3, CFF, [1024]]                  # 16 (P5/32-large): Feature fusion for large objects

  # Detection heads
  - [[10, 13, 16], 1, Detect, [nc]]       # Detect(P3, P4, P5)
