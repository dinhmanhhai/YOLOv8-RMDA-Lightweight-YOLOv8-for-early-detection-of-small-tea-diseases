# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-MobileNetV4-MQA object detection model with Multi-Query Attention
# Based on: "TDDet: A novel lightweight and efficient tea disease detector"

# Parameters
nc: 6  # number of classes (tea diseases)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024] # Use scale 'l' to keep original channel counts (64, 128...) defined in code

# Backbone: Decomposed into stages using MNV4Stage
backbone:
  # [from, repeats, module, args]
  
  # 0. Stem (Stage 1) - 320x320x64
  - [-1, 1, Conv, [64, 3, 2]] 

  # 1. Stage 2 (P2) - 160x160x128
  # Args: [Model Name, Stage Name]
  - [-1, 1, MNV4Stage, ["MobileNetV4ConvLargeMQA", "layer1"]]

  # 2. Stage 3 (P3) - 80x80x256
  - [-1, 1, MNV4Stage, ["MobileNetV4ConvLargeMQA", "layer2"]]

  # 3. Stage 4 (P4) - 40x40x512 with MQA
  - [-1, 1, MNV4Stage, ["MobileNetV4ConvLargeMQA", "layer3"]]

  # 4. Stage 5 (P5) - 20x20x512 with MQA
  - [-1, 1, MNV4Stage, ["MobileNetV4ConvLargeMQA", "layer4"]]
  
  # 5. Final Conv - 20x20x512 (Grey Box in paper)
  - [-1, 1, Conv, [512, 3, 1]]

  # 6. SPPF - 20x20x512
  - [-1, 1, SPPF, [1024, 5]]

# Head: Feature fusion with CFF (Cross-scale Feature Fusion) and DySample upsampling
head:
  # Upsample and fuse P5 -> P4
  - [-1, 1, DySample, [2, 'lp']]          # 7: Upsample P5 (Input: SPPF-6)
  - [[-1, 3], 1, Concat, [1]]             # 8: Concat with P4 (Layer 3)
  - [-1, 3, CFF, [512]]                   # 9: Cross-scale Feature Fusion

  # Upsample and fuse P4 -> P3
  - [-1, 1, DySample, [2, 'lp']]          # 10: Upsample
  - [[-1, 2], 1, Concat, [1]]             # 11: Concat with P3 (Layer 2)
  - [-1, 3, CFF, [256]]                   # 12 (P3/8-small): Feature fusion for small objects

  # Downsample and fuse P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]            # 13: Downsample 2x
  - [[-1, 9], 1, Concat, [1]]             # 14: Concat with Head P4 (Layer 9)
  - [-1, 3, CFF, [512]]                   # 15 (P4/16-medium): Feature fusion for medium objects

  # Downsample and fuse P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]            # 16: Downsample 2x
  - [[-1, 6], 1, Concat, [1]]             # 17: Concat with SPPF (Layer 6)
  - [-1, 3, CFF, [1024]]                  # 18 (P5/32-large): Feature fusion for large objects

  # Detection heads
  - [[12, 15, 18], 1, Detect, [nc]]       # Detect(P3, P4, P5)
